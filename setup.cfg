[metadata]
name = starkit
description = Collection of tools for working with stellar data
long_description = Collection of tools for working with stellar data
author = Wolfgang Kerzendorf, Tuan Do
author_email = wkerzendorf@gmail.com
license = BSD
url = https://github.com/starkit/starkit

[options]
packages = find:
include_package_data = True
zip_safe = False
# The packages that `import starkit` already needs, plus tables, which
# pandas.read_hdf requires for loading grids.
install_requires =
    astropy
    h5py
    numpy
    pandas
    scipy
    tables
    tqdm

[options.package_data]
starkit =
    data/*
    **/*.c

[options.extras_require]
grid_io =
    progressbar2
    sqlalchemy
multinest =
    corner
    pymultinest
parallel =
    ipyparallel
    psutil
photometry =
    wsynphot
all =
    corner
    ipyparallel
    progressbar2
    psutil
    pymultinest
    sqlalchemy

[options.packages.find]
include =
    starkit
    starkit.*

[tool:pytest]
minversion = 2.2
norecursedirs = build docs/_build
