name: Docs

# Builds the documentation on every pull request, so a broken build shows up
# before merging, and publishes it to GitHub Pages
# (https://starkit.github.io/starkit/) on every push to master. Publishing
# needs the Pages source of the repository set to "GitHub Actions".

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new commit on a pull request cancels the build of the previous one; runs
# on master are not cancelled, so a deployment is never interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pandoc
        # nbsphinx converts the notebooks with pandoc, which pip does not
        # install.
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Install StarKit with the docs extra
        run: python -m pip install '.[docs]'
      - name: Build the HTML pages
        # The notebooks are not run (nbsphinx_execute = 'never' in
        # docs/conf.py), so neither MultiNest nor wsynphot is needed.
        run: make -C docs html
      - name: Upload the pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Let a deployment that has started finish before the next one.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
